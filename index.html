<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b11" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Draw studio</title>
    <style>
      #app-startup {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: #000;
        color: #f5f5f5;
        font: 15px "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #app-startup strong { font-size: 24px; }
      #startup-status { margin: 0; color: #aeb3b5; }
      #startup-reload {
        padding: 10px 20px;
        border: 1px solid #45494b;
        border-radius: 10px;
        background: #26282a;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-startup">
        <strong>Draw studio</strong>
        <p id="startup-status" role="status">正在打开你的创作空间…</p>
        <button type="button" id="startup-reload">重新加载</button>
      </div>
    </div>
    <script>
      document.getElementById("startup-reload").addEventListener("click", function () {
        window.location.reload();
      });
      window.addEventListener("error", function () {
        const status = document.getElementById("startup-status");
        if (status) status.textContent = "页面资源加载失败，请重新加载。";
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
