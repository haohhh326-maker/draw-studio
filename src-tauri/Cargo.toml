[package]
name = "ai-infinite-canvas"
version = "0.1.0"
description = "Draw studio"
authors = ["Clearframe"]
edition = "2021"

[lib]
name = "ai_infinite_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }


rfd = "0.15"
